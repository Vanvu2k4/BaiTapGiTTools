<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Fashion Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .register-container { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
            width: 400px; 
            text-align: center;
        }
        h2 { 
            color: #333; 
            margin-bottom: 30px; 
            font-weight: 600;
            text-transform: uppercase; 
            letter-spacing: 1px;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            transition: color 0.3s;
        }
        .input-group input { 
            width: 100%; 
            padding: 12px 15px 12px 45px; 
            border: 2px solid #eee; 
            border-radius: 30px; 
            outline: none;
            transition: all 0.3s;
            font-size: 14px;
            font-family: inherit;
        }
        .input-group input:focus {
            border-color: #764ba2;
        }
        .input-group input:focus + i {
            color: #764ba2;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(to right, #667eea, #764ba2); 
            color: white; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.6);
        }
        .social-login {
            margin-top: 25px;
        }
        .social-login p {
            color: #888;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .social-icons a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            background: #f0f2f5;
            border-radius: 50%;
            margin: 0 8px;
            color: #555;
            text-decoration: none;
            transition: all 0.3s;
        }
        .social-icons a:hover {
            background: #764ba2;
            color: white;
            transform: scale(1.1);
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            display: none;
        }
        .message.error {
            background-color: #ffdddd;
            color: #f44336;
            border: 1px solid #f44336;
        }
        .message.success {
            background-color: #ddffdd;
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        .terms-group {
            text-align: left;
            margin-bottom: 20px;
            font-size: 13px;
            color: #555;
            display: flex;
            align-items: center;
        }
        .terms-group input {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .terms-group label {
            cursor: pointer;
        }
        .terms-group a {
            color: #764ba2;
            text-decoration: none;
            font-weight: 500;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shake 0.5s;
        }
        button.loading {
            position: relative;
            color: transparent;
        }
        button.loading::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Tạo tài khoản</h2>
        <div id="message" class="message"></div>
        <form id="registerForm">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="fullname" placeholder="Họ và tên" required>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Địa chỉ Email" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Mật khẩu (Gồm số, chữ hoa & 8+ ký tự)" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
            </div>
            
            <div class="terms-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">Tôi đồng ý với <a href="#">Điều khoản sử dụng</a></label>
            </div>

            <button type="submit" id="submitBtn">Đăng ký ngay</button>
        </form>
        
        <div class="social-login">
            <p>Hoặc đăng nhập bằng</p>
            <div class="social-icons">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-google"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            const form = document.getElementById('registerForm');
            
            // Helper function to show errors
            function showError(msg) {
                messageDiv.textContent = msg;
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                
                // Add shake animation
                form.classList.add('shake');
                setTimeout(() => form.classList.remove('shake'), 500);
            }

            // Reset message
            messageDiv.style.display = 'none';
            messageDiv.className = 'message';
            
            // --- Advanced Validation ---

            // 1. Check Full Name length
            if (fullname.length < 2) {
                showError('Vui lòng nhập họ tên đầy đủ!');
                return;
            }

            // 2. Format Email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Địa chỉ email không hợp lệ!');
                return;
            }

            // 3. Password Strength (Minimum 8 chars, 1 uppercase, 1 lowercase, 1 number)
            const passwordRegex = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$/;
            if (!passwordRegex.test(password)) {
                showError('Mật khẩu quá yếu! Cần ít nhất 8 ký tự, bao gồm chữ hoa, chữ thường và số.');
                return;
            }

            // 4. Match Passwords
            if (password !== confirmPassword) {
                showError('Mật khẩu xác nhận không khớp!');
                return;
            }

            // 5. Terms Agreement
            if (!terms) {
                showError('Bạn cần đồng ý với điều khoản sử dụng!');
                return;
            }
            
            // --- Success Simulation ---
            
            // Desable button & show loading
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            
            setTimeout(() => {
                // Success
                messageDiv.textContent = 'Đăng ký thành công! Đang chuyển hướng...';
                messageDiv.className = 'message success';
                messageDiv.style.display = 'block';
                
                submitBtn.classList.remove('loading');
                submitBtn.textContent = 'Đã đăng ký';
                
                // Clear form
                form.reset();
                
                // Redirect simulation
                setTimeout(() => {
                    alert("Chuyển đến trang đăng nhập!");
                    // window.location.href = 'login.html'; 
                }, 1500);
                
                submitBtn.disabled = false;
            }, 2000);
        });
    </script>
</body>
</html>
